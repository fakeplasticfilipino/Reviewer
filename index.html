<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviewer</title>
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <main id="app">
    <!-- Setup screen -->
    <section id="setup" class="screen">
      <h1>Reviewer</h1>
      <p class="muted">Pick what to review, then how many questions.</p>

      <label class="field">
        <span>Term</span>
        <select id="term"></select>
      </label>

      <label class="field">
        <span>Subject</span>
        <select id="subject"></select>
      </label>

      <fieldset class="field">
        <legend>Handouts</legend>
        <div id="handouts"></div>
      </fieldset>

      <label class="field">
        <span>Number of questions <small id="available" class="muted"></small></span>
        <div class="count-row">
          <input type="number" id="count" min="1" value="10">
          <button type="button" class="chip" data-count="10">10</button>
          <button type="button" class="chip" data-count="20">20</button>
          <button type="button" class="chip" data-count="all">All</button>
        </div>
      </label>

      <button id="start" class="primary">Start quiz</button>
      <p id="setup-error" class="error"></p>
    </section>

    <!-- Quiz screen -->
    <section id="quiz" class="screen" hidden>
      <div class="quiz-top">
        <span id="progress" class="muted"></span>
        <span id="score-live" class="muted"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="q-source" class="source"></p>
      <h2 id="question"></h2>
      <div id="choices"></div>
      <div id="feedback" hidden></div>
      <button id="next" class="primary" hidden>Next</button>
    </section>

    <!-- Results screen -->
    <section id="results" class="screen" hidden>
      <h1 id="final-score"></h1>
      <p id="final-msg" class="muted"></p>
      <div class="actions">
        <button id="retry-missed" class="primary">Retry missed</button>
        <button id="restart">New quiz</button>
      </div>
      <div id="review"></div>
    </section>
  </main>

  <script src="data/catalog.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
